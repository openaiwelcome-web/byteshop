<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ByteShop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; }
  
  #lock-screen {
    position:fixed; inset:0; z-index:9999;
    background:#0a0a0a; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: -apple-system, sans-serif;
  }
  .icon { font-size:80px; margin-bottom:20px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  #msg { font-size:18px; padding:0 30px; text-align:center; }
  .sub { font-size:14px; opacity:0.6; margin-top:10px; text-align:center; padding:0 30px; }
  
  #site-frame {
    position:fixed; inset:0; width:100%; height:100%;
    border:none; display:none;
  }
</style>
</head>
<body>
  <div id="lock-screen">
    <div class="icon">🔐</div>
    <div id="msg">برای ورود، اثر انگشت خود را اسکن کنید…</div>
    <div class="sub" id="sub"></div>
  </div>
  
  <iframe id="site-frame" src="about:blank" allow="fullscreen; geolocation; camera; microphone"></iframe>

<script type="module">
  import { NativeBiometric } from '@capgo/capacitor-native-biometric';
  import { InAppBrowser } from '@capacitor/inappbrowser';

  const SITE_URL = 'https://byteshop.top';

  async function authenticate() {
    try {
      const check = await NativeBiometric.isAvailable();
      if (!check.isAvailable) {
        document.getElementById('sub').innerText = 'اثر انگشت روی این دستگاه تنظیم نشده';
        setTimeout(loadSite, 1500);
        return;
      }

      await NativeBiometric.verifyIdentity({
        reason: 'برای ورود به ByteShop تأیید هویت کنید',
        title: 'ورود به ByteShop',
        subtitle: 'اثر انگشت خود را اسکن کنید',
        description: '',
        useFallback: true,
        maxAttempts: 3,
      });

      loadSite();
    } catch (err) {
      document.getElementById('msg').innerText = 'تأیید هویت ناموفق بود';
      document.getElementById('sub').innerText = 'دوباره تلاش کنید...';
      setTimeout(authenticate, 1500);
    }
  }

  async function loadSite() {
    document.getElementById('lock-screen').style.display = 'none';
    const frame = document.getElementById('site-frame');
    frame.src = SITE_URL;
    frame.style.display = 'block';
  }

  authenticate();
</script>
</body>
</html>
