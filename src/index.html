<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ByteShop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; background:#0a0a0a; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; flex-direction:column; }
  .icon { font-size:80px; margin-bottom:20px; }
  #msg { text-align:center; font-size:18px; padding:0 30px; }
  .sub { font-size:14px; opacity:0.6; margin-top:10px; }
</style>
</head>
<body>
<div class="icon">🔐</div>
<div id="msg">برای ورود، اثر انگشت خود را اسکن کنید…</div>
<div class="sub" id="sub"></div>
<script type="module">
  import { NativeBiometric } from '@capgo/capacitor-native-biometric';

  const SITE_URL = 'https://byteshop.top';

  async function authenticate() {
    try {
      const check = await NativeBiometric.isAvailable();
      if (!check.isAvailable) {
        document.getElementById('sub').innerText = 'اثر انگشت روی این دستگاه تنظیم نشده';
        setTimeout(() => { window.location.href = SITE_URL; }, 1500);
        return;
      }

      await NativeBiometric.verifyIdentity({
        reason: 'برای ورود به ByteShop تأیید هویت کنید',
        title: 'ورود به ByteShop',
        subtitle: 'اثر انگشت خود را اسکن کنید',
        description: '',
        useFallback: true,
        maxAttempts: 3,
      });

      window.location.href = SITE_URL;
    } catch (err) {
      document.getElementById('msg').innerText = 'تأیید هویت ناموفق بود';
      document.getElementById('sub').innerText = 'دوباره تلاش کنید...';
      setTimeout(authenticate, 1500);
    }
  }

  authenticate();
</script>
</body>
</html>
